[package]
name = "el_gate"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Modern high-performance launcher for Eltharn and Minecraft-compatible client engines"

[[bin]]
name = "eltharn_gate"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "svg", "tokio", "advanced", "image-without-codecs", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "macros"] }
sha1 = "0.10"
dirs = "5.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
el_launcher_core = { path = "../Eltharn/crates/el_launcher_core" }
el_extension_manager = { path = "../Eltharn/crates/el_extension_manager" }
pollster = "0.4"
el_launcher_theme = { path = "../Eltharn/crates/el_launcher_theme" }
raw-window-handle = "0.6"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31.14", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-sys = { version = "0.31", features = ["client"] }
libc = "0.2"

[build-dependencies]
embed-resource = "2.5"


[package]
name = "el_android"
version = "0.1.0"
edition = "2024"
description = "Android GameActivity lifecycle shell for Eltharn Gate and Eltharn"
license.workspace = true

[lib]
name = "eltharn_android"
crate-type = ["cdylib", "rlib"]

[features]
extensions = ["el_client/extensions"]
shaderpacks = ["el_client/shaderpacks"]
shader-probe = ["shaderpacks"]

[dependencies]
el_app = { path = "../../crates/el_app" }
el_platform_api = { path = "../../crates/el_platform_api" }


[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.5.2", features = ["game-activity"] }
el_client = { path = "../../crates/el_client" }
jni = "0.21"
ndk = "0.8.0"
log = "0.4"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
url = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }



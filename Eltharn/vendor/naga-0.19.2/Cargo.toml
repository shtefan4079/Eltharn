










[package]
edition = "2021"
rust-version = "1.70"
name = "naga"
version = "0.19.2"
authors = ["gfx-rs developers"]
exclude = [
    "bin/**/*",
    "tests/**/*",
    "Cargo.lock",
    "target/**/*",
]
autotests = false
description = "Shader translation infrastructure"
readme = "README.md"
keywords = [
    "shader",
    "SPIR-V",
    "GLSL",
    "MSL",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gfx-rs/wgpu/tree/trunk/naga"
resolver = "2"

[package.metadata.docs.rs]
all-features = true

[dependencies.arbitrary]
version = "1.3"
features = ["derive"]
optional = true

[dependencies.bit-set]
version = "0.5"

[dependencies.bitflags]
version = "2.2"

[dependencies.codespan-reporting]
version = "0.11.0"

[dependencies.hexf-parse]
version = "0.2.1"
optional = true

[dependencies.indexmap]
version = "2"
features = ["std"]

[dependencies.log]
version = "0.4"

[dependencies.num-traits]
version = "0.2"

[dependencies.petgraph]
version = "0.6"
optional = true

[dependencies.pp-rs]
version = "0.2.1"
optional = true

[dependencies.rustc-hash]
version = "1.1.0"

[dependencies.serde]
version = "1.0.195"
features = ["derive"]
optional = true

[dependencies.spirv]
version = "0.3"
optional = true

[dependencies.termcolor]
version = "1.4.1"

[dependencies.thiserror]
version = "1.0.56"

[dependencies.unicode-xid]
version = "0.2.3"
optional = true

[features]
arbitrary = [
    "dep:arbitrary",
    "bitflags/arbitrary",
    "indexmap/arbitrary",
]
clone = []
compact = []
default = []
deserialize = [
    "serde",
    "bitflags/serde",
    "indexmap/serde",
]
dot-out = []
glsl-in = ["pp-rs"]
glsl-out = []
hlsl-out = []
msl-out = []
serialize = [
    "serde",
    "bitflags/serde",
    "indexmap/serde",
]
spv-in = [
    "petgraph",
    "spirv",
]
spv-out = ["spirv"]
wgsl-in = [
    "hexf-parse",
    "unicode-xid",
    "compact",
]
wgsl-out = []


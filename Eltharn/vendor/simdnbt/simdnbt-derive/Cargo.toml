










[package]
edition = "2021"
name = "simdnbt-derive"
version = "0.10.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Derive macros for simdnbt"
readme = "README.md"
license = "MIT"
repository = "https://github.com/azalea-rs/simdnbt"

[lib]
name = "simdnbt_derive"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1.0.100"

[dependencies.quote]
version = "1.0.40"

[dependencies.syn]
version = "2.0.106"

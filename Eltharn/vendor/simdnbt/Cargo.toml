










[package]
edition = "2024"
name = "simdnbt"
version = "0.10.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "an unnecessarily fast nbt decoder"
readme = "README.md"
license = "MIT"
repository = "https://github.com/azalea-rs/simdnbt"
resolver = "2"

[features]
default = [
    "derive",
    "serde",
]
derive = ["dep:simdnbt-derive"]
serde = ["dep:serde"]

[lib]
name = "simdnbt"
path = "src/lib.rs"

[dependencies.byteorder]
version = "1.5.0"

[dependencies.flate2]
version = "^1.1.2"

[dependencies.serde]
version = "1.0.219"
optional = true

[dependencies.simd_cesu8]
version = "1.1.0"

[dependencies.simdnbt-derive]
version = "0.10.0"
optional = true

[dependencies.thiserror]
version = "2.0.15"


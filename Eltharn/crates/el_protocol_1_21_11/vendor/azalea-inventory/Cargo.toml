[package]
name = "azalea-inventory"
description = "Representations of various inventory data structures in Minecraft."
version = "0.15.0+mc1.21.11"
edition = "2024"
license = "MIT"
repository = "https://github.com/azalea-rs/azalea"

[dependencies]
azalea-auth = { git = "https://github.com/azalea-rs/azalea", rev = "41a9ae6aaff77646c08c64ac1334a8cc6081c24f" }
azalea-buf = { git = "https://github.com/azalea-rs/azalea", rev = "41a9ae6aaff77646c08c64ac1334a8cc6081c24f" }
azalea-chat = { git = "https://github.com/azalea-rs/azalea", rev = "41a9ae6aaff77646c08c64ac1334a8cc6081c24f", features = ["azalea-buf"] }
azalea-core = { git = "https://github.com/azalea-rs/azalea", rev = "41a9ae6aaff77646c08c64ac1334a8cc6081c24f", features = ["serde"] }
azalea-inventory-macros = { git = "https://github.com/azalea-rs/azalea", rev = "41a9ae6aaff77646c08c64ac1334a8cc6081c24f" }
azalea-registry = { git = "https://github.com/azalea-rs/azalea", rev = "41a9ae6aaff77646c08c64ac1334a8cc6081c24f", features = ["serde"] }
indexmap = "2.13"
serde = { version = "1.0", features = ["derive"] }
simdnbt = { git = "https://github.com/azalea-rs/simdnbt" }
tracing = "0.1"
uuid = "1.22"

[package]
name = "el_core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
el_math = { package = "el_math", path = "../el_math", version = "0.1.0" }
el_nbt = { package = "el_nbt", path = "../el_nbt", version = "0.1.0" }
uuid = { version = "1.8", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]


uuid = { version = "1.8", features = ["v4", "serde", "js"] }

[package]
name = "el_mod_web"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
el_mod_content = { path = "../el_mod_content" }
el_mod_runtime = { path = "../el_mod_runtime" }
el_extension_api = { path = "../el_extension_api" }
wasm-bindgen = "=0.2.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

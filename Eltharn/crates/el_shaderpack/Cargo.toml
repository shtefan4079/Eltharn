[package]
name = "el_shaderpack"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["gpu"]
gpu = ["dep:wgpu"]

[dependencies]
el_extension_api = { path = "../el_extension_api" }
el_platform_api = { path = "../el_platform_api" }

el_strict_json = { path = "../el_strict_json" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
glam = "0.27"
naga = { version = "=0.19.2", features = ["wgsl-in"] }
wgpu = { version = "0.19", features = ["webgl"], optional = true }

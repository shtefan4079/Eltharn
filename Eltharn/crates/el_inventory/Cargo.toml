[package]
name = "el_inventory"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
name = "el_inventory"
path = "src/lib.rs"

[dependencies]
el_core = { package = "el_core", path = "../el_core" }
el_data = { package = "el_data", path = "../el_data" }
el_nbt = { package = "el_nbt", path = "../el_nbt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
